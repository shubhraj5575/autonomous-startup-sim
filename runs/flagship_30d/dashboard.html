// ---------- charting ----------
function lineChart(canvas, series, opts={}){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth, H = canvas.clientHeight||240;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const g = canvas.getContext('2d'); g.scale(dpr,dpr);
  const padL=64,padR=12,padT=12,padB=22;
  const iw=W-padL-padR, ih=H-padT-padB;
  let vmax=-Infinity,vmin=Infinity,xmax=0;
  for(const s of series){for(const p of s.points){
    if(p[1]!=null){vmax=Math.max(vmax,p[1]);vmin=Math.min(vmin,p[1]);}
    xmax=Math.max(xmax,p[0]);}}
  if(opts.zero)vmin=Math.min(0,vmin);
  if(!isFinite(vmin)){return;} if(vmax===vmin)vmax=vmin+1;
  const X=x=>padL+iw*(x/xmax), Y=v=>padT+ih*(1-(v-vmin)/(vmax-vmin));
  // grid
  g.strokeStyle='#21262d';g.fillStyle='#8b949e';g.font='10px sans-serif';
  for(let i=0;i<=4;i++){const v=vmin+(vmax-vmin)*i/4,y=Y(v);
    g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();
    g.fillText(opts.fmt?opts.fmt(v):Math.round(v),4,y+3);}
  for(const s of series){
    g.strokeStyle=s.color;g.lineWidth=1.6;g.beginPath();let started=false;
    for(const [x,v] of s.points){ if(v==null)continue;
      const px=X(x),py=Y(v);
      if(!started){g.moveTo(px,py);started=true;}else g.lineTo(px,py);}
    g.stroke();
    if(s.label){const last=s.points.filter(p=>p[1]!=null).pop();
      g.fillStyle=s.color;g.fillText(s.label,X(last[0])-g.measureText(s.label).width-2,Y(last[1])-5);}
  }
  g.fillStyle='#8b949e';
  g.fillText('day '+xmax, W-padR-40, H-6);
}

V.decisions = () => {
  const sc=DATA.decision_scorecard;
  let h=`<h2>Decision scorecard</h2><p>${sc.total} major decisions:
   <span class="pill success">${sc.success} success</span>
   <span class="pill partial">${sc.partial} partial</span>
   <span class="pill fail">${sc.fail} fail</span></p>`;
  h+='<table><tr><th>Day</th><th>Agent</th><th>Kind</th><th>Decision</th><th>Reasoning</th><th>Expected</th><th>Verdict</th></tr>';
  for(const d of [...DATA.decisions].reverse()){
    const exp=Object.entries(d.expected||{}).map(([k,v])=>k+' '+(v>0?'+':'')+v).join(', ');
    const act=d.actual?(typeof d.actual==='object'?JSON.stringify(d.actual):d.actual):'';
    h+=`<tr><td>${d.day}</td><td>${d.agent}</td><td>${d.kind}</td>
      <td style=max-width:280px>${d.decision}<details><summary>actual</summary><pre>${act}</pre></details></td>
      <td style="max-width:300px;color:var(--dim)">${d.reasoning}</td>
      <td>${exp}</td><td><span class="pill ${d.verdict||'untracked'}">${d.verdict||'pending'}</span>
      ${d.lesson?'<details><summary>lesson</summary><pre>'+d.lesson+'</pre></details>':''}</td></tr>`;
  }
  return el(h+'</table>');
};

V.events = () => {
  const evs=[...DATA.company_events.map(e=>({...e,type:'company'})),
             ...DATA.market_events.map(e=>({...e,type:'market'}))]
            .sort((a,b)=>a.day-b.day);
  let h='<h2>History timeline</h2><table><tr><th>Day</th><th>Source</th><th>Event</th></tr>';
  for(const e of evs.slice().reverse()){
    h+=`<tr><td>${e.day}</td><td>${e.type}</td><td>${e.note||e.name}</td></tr>`;
  }
  return el(h+'</table>');
};

V.market = () => {
  let h='<h2>Competitors at end of run</h2><table><tr><th>Name</th><th>Archetype</th><th>Customers</th><th>Quality</th><th>Price mult</th><th>Brand</th><th>Features</th></tr>';
  for(const c of DATA.competitors_final){
    h+=`<tr><td>${c.name}</td><td>${c.archetype}</td><td>${c.customers}</td>
        <td>${c.quality.toFixed(2)}</td><td>x${c.price_mult.toFixed(2)}</td>
        <td>${c.brand.toFixed(2)}</td><td style=color:var(--dim)>${c.features.join(', ')}</td></tr>`;
  }
  h+='</table>';
  h+='<h2>Marketing channels (trailing 30d)</h2><table><tr><th>Channel</th><th>Spend</th><th>Leads</th><th>Observed CPL</th><th>Learned score</th><th>Cumulative spend</th></tr>';
  for(const [k,v] of Object.entries(DATA.channel_summary)){
    h+=`<tr><td>${k}</td><td>${inr(v.spend30)}</td><td>${v.leads30}</td>
        <td>${inr(v.observed_cpl)}</td><td>${v.score}</td><td>${inr(v.cum_spend)}</td></tr>`;
  }
  h+='</table>';
  h+='<h2>Customer pool state</h2><pre>'+JSON.stringify(DATA.customer_states,null,1)+
     '\nTotal universe: '+DATA.pool_size.toLocaleString()+'</pre>';
  return el(h);
};

function mount(){
  document.getElementById('title').textContent =
    `${DATA.name} \u2014 ${DATA.alive?'ALIVE':'DEAD'} @ day ${DATA.days_run}`;
  document.getElementById('subline').textContent =
    `Strategy: ${DATA.strategy} \u00b7 seed ${DATA.config.seed} \u00b7 capital ${inr(DATA.config.starting_capital)} \u00b7 ${DATA.created_utc?.slice(0,10)}` +
    (DATA.death_reason?` \u00b7 ${DATA.death_reason}`:'');
  const tabs=[['overview','Overview'],['decisions','Decisions'],['events','Timeline'],['market','Market']];
  const tabEls=document.getElementById('tabs'), views=document.getElementById('views');
  tabs.forEach(([id,label],i)=>{
    const b=document.createElement('button'); b.textContent=label;
    b.onclick=()=>{ [...tabEls.children].forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); render(id); };
    if(i===0)b.classList.add('on');
    tabEls.appendChild(b);
  });
  function render(id){
    views.innerHTML=''; const node=V[id](); views.appendChild(node);
    if(id==='overview') drawCharts();
  }
  render('overview');
  window.addEventListener('resize',()=>render(
    [...tabEls.children].findIndex(x=>x.classList.contains('on'))===0?'overview':'overview'));
}

function drawCharts(){
  const H=DATA.kpi_series;
  const pts=key=>H.map(s=>[s.day, s[key]]);
  lineChart(document.getElementById('c_cash'),[
    {label:'Cash',color:'#58a6ff',points:pts('cash')},
    {label:'MRR',color:'#3fb950',points:H.map(s=>[s.day,s.mrr])},
  ],{zero:true,fmt:inr});
  lineChart(document.getElementById('c_cust'),[
    {label:'Customers',color:'#d29922',points:pts('active_customers')},
    {label:'Share %',color:'#bc8cff',points:H.map(s=>[s.day,s.market_share_pct])},
  ],{fmt:v=>Math.round(v)});
  lineChart(document.getElementById('c_unit'),[
    {label:'CAC',color:'#f85149',points:pts('cac_blended')},
    {label:'Churn %/mo',color:'#d29922',points:H.map(s=>[s.day,s.logo_churn_pct_monthly])},
  ],{fmt:v=>Math.round(v)});
  lineChart(document.getElementById('c_unit1'),[
    {label:'Brand',color:'#58a6ff',points:H.map(s=>[s.day,(s.brand_awareness*100)])},
  ],{fmt:v=>Math.round(v)+'%'});
  lineChart(document.getElementById('c_unit2'),[
    {label:'Pipeline value',color:'#3fb950',points:pts('pipeline_value')},
  ],{fmt:inr});
}

mount();
</script></body></html>
